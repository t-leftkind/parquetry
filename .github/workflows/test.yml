name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # parquet-floor pulls org.apache.parquet/parquet-hadoop, whose Arrow
          # paths need --add-opens on 17+. The library itself does not, but
          # keeping the JDK pinned here matches what the jobs run.
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-
      - run: clojure -M:test
